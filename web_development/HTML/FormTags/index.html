<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basik Form</title>
</head>
<body>
    <fieldset>
        <legend align="center">Basic Form</legend>
        <form>
        <label for="FullName">Full Name :</label>
        <input type="text" name="FullName" id="FullName" placeholder="Enter Your Name"/>

        <br>
        <br>

        <label for="email">Email</label>
        <input type="text" name="email" id="email" placeholder="Your Email">

        <br>
        <br>
        <label for="password">Password</label>
        <input type="password" name="Password" id="Password" placeholder="Your Password">

        <br>
        <br>

        <label for="cfpassword">Confirm Password</label>
        <input type="password" name="password" id="password" placeholder="Confirm Your Password">
        
        <br>
        <br>

        <label for="dob">Date of birth</label>
        <input type="date" name="dob" id="dob">

        <br>
        <br>
        <label for="tob">Time of Birth</label>
        <input type="time" name="tob" id="tob">

        <br>
        <br>
        <label for="joiningtime">Joining Time</label>
        <input type="datetime-local" name="joiningtime" id="joiningtime">

        <br>
        <br>

        <label for="volume">Volume</label>
        <input type="range" name="volume" id="volume" min="0" max="20" value="1">

        <br>
        <br>

        <label for="mobile">Mobile no:</label>
        <input type="number" name="mobile" id="mobile" >

        <br>
        <br>

        <label for="resume">Resume :</label>
        <input type="file" name="resume" id="resume">

        <br>
        <br>
        <label for="address">Address :</label>
        <textarea name="address" id="address"></textarea>

        <br>
        <br>
        <label for="Cource">Course :</label>
        <select name="course" id="course">
            <option value="">--Select Course--</option>
            <option value="bTech">B Tech</option>
             <option value="mba">MBA</option>
              <option value="bba">BBA</option>
              <option value="mtech">M TECH</option> 
        </select>


        <br>
        <br>
        <label for="gender">Gender</label>
        <input type="radio" name="gender" id="Male" value="Male">
        <span>Male</span>
        <input type="radio" name="gender" id="Female" value="Female">
        <span>Female</span>
        <input type="radio" name="gender" id="other" value="other">
        <span>Other</span>


        <br>
        <br>
        <img src="" alt="" width="" height="">

<br>






        <br>
        <br>
        <button>Submit</button>


    </form>
    </fieldset>
    
</body>
</html>

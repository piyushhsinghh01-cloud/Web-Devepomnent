<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <hr>
     <h1>Task 2</h1>
    <hr />
    <fieldset>
      <form>
        <h1>Pizza Order Form</h1>
        <label for="firstname">First Name:</label>
        <input type="text" name="firstname" id="firstname" />

        <br />
        <br />
        <label for="lastname">Last Name:</label>
        <input type="text" name="lastname" id="lastname" />
        <br />
        <br />

        <label for="emailaddress">Email Address:</label>
        <input type="email" name="emailaddress" id="emailaddress" />
        <br />
        <br />

        <label for="contactnumber">Contact Number:</label>
        <input type="number" name="contactnumber" id="contactnumber" />
        <br />
        <br />

        <label for="pdd">Preferred Delivery Date</label>
        <input type="date" name="pdd" id="pdd" />
        <br />
        <br />

        <label for="size">Size:</label>
        <br />

        <label for="size"></label>
        <input type="radio" name="size" id="Small" />
        <span>Small</span>
        <input type="radio" name="size" id="Medium" />
        <span>Medium</span>
        <input type="radio" name="size" id="Large" />
        <span>Large</span>

        <br />
        <br />
        <label for="Flavor">Flavor</label>
        <br />

        <label for="Flavor"></label>
        <input type="checkbox" name="Flavor" id="Hawaiian(Phd 150.00)" />
        <span>Hawaiian(Phd 150.00)</span>
        <br />
        <input type="checkbox" name="Flavor" id="Pepperoni (Phd 140.00)" />
        <span>Pepperoni (Phd 140.00)</span>
        <br />
        <input type="checkbox" name="Flavor" id="Vegetable (Phd 130.00)" />
        <span>Vegetable (Phd 130.00)</span>

        <br />
        <br />
        <label for="creditcardnumber">Credit Card Number:</label>
        <input type="number" name="creditcardnumber" id="creditcardnumber" />
        <br />
        <br />

        <label for="PIN">PIN:</label>
        <input type="number" name="PIN" id="PIN" />
        <br />
        <br />
        <label for="Additionalnote">Additional Note:</label>
        <br />
        <label for="Additionalnote"></label>
        <textarea name="Additionalnote" id="Additionalnote"></textarea>
        <br />
        <br />
        <button>Submit Order</button>
      </form>
    </fieldset>
    <br>
    <br>
   
    <button><a href="../../index.html" style="background-color: #e7e7e7;">Back to Home</a></button>
    
</body>
</html>
